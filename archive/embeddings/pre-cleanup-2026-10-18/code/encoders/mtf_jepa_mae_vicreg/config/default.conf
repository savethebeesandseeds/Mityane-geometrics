# Small MTF-JEPA-MAE-VICReg baseline for CPU smoke training.
# Input: [samples, channels, history, features], feature_mask=true means observed.
channel_count = 3
history_length = 32
input_width = 3
d_model = 16
latent_dim = 12
projector_dim = 20
predictor_hidden_dim = 24
num_encoder_layers = 1
num_predictor_layers = 1
num_decoder_layers = 1
num_heads = 3
dropout = 0.05
time_scales = 4,8
scale_strides = 2,4
use_frequency_tokens = true
frequency_num_bins = 6
frequency_log_magnitude = true
mask_ratio_time = 0.35
mask_ratio_frequency = 0.20
mask_ratio_channel = 0.02
min_context_ratio = 0.35
lambda_jepa = 1.0
lambda_mae = 0.20
lambda_tf_align = 0.05
lambda_vicreg = 0.02
target_ema_tau = 0.98
use_channel_vicreg = true
lambda_global_vicreg = 0.5
lambda_channel_vicreg = 0.5

# The setup includes CUDA LibTorch; CPU is the portable default.
device = cpu
steps = 8
batch_size = 4
seed = 101
threads = 1
log_every = 1
learning_rate = 0.001
weight_decay = 0.0001
gradient_clip_norm = 1.0
