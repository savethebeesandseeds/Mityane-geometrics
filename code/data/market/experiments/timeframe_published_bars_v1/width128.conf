# Same January timeframe geometry as width64.conf, with encoder width 128.
# Feed-forward width stays 256. Native width stays 36.
ENCODER {
  MODEL_TAG = CPB-family;
  CHANNEL_COUNT = 3;
  CHANNEL_IDS = 4, 9, 15;
  INPUT_WIDTH = 9;
  HISTORY_LENGTH = 128;
  PATCH_LENGTH = 8;
  LEVEL_EMBEDDING_SIZE = 32;
  EMBEDDING_SIZE = 36;
  ENCODER_WIDTH = 128;
  NUM_LAYERS = 3;
  NUM_HEADS = 4;
  FEEDFORWARD_WIDTH = 256;
  DECODER_HIDDEN_WIDTH = 128;
  MASK_RATIO = 0.25;
  HUBER_DELTA = 1.0;
  SCALE_FLOOR = 0.000001;
  LAYER_NORM_EPSILON = 0.00001;
  SAMPLING_INTERVAL = 60000;
  DEVICE = cuda:0;
}
