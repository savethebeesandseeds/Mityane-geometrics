# Packed January development geometry. Encoder capacity matches width128.conf.
# The finest channel is 5-minute bars, not 1-minute bars. The packing width is 24
# slots: 24 five-minute bars, 12 hourly bars, and 1 daily bar. This file does not
# replace width128.conf and it does not promote a research reference.
# PATCH_LENGTH is 8, so the 24-slot row is 3 groups. A channel is a
# reconstruction target only when every group contains one of its candles.
# Right-aligned into 24 slots, the 5-minute channel fills all three groups and
# can be a target. The hour channel fills two groups and the day channel fills
# one. Those two stay visible context and are not reconstruction targets. The
# application declaration of 24 five-minute,
# 24 hourly, and 7 daily bars is a different count. Seven daily bars still fill
# only the last group under this patch length, so this file does not copy them.
ENCODER {
  MODEL_TAG = CPB-family;
  CHANNEL_COUNT = 3;
  CHANNEL_IDS = 6, 9, 15;
  CHANNEL_BAR_COUNTS = 24, 12, 1;
  INPUT_WIDTH = 9;
  HISTORY_LENGTH = 24;
  PATCH_LENGTH = 8;
  LEVEL_EMBEDDING_SIZE = 32;
  EMBEDDING_SIZE = 36;
  ENCODER_WIDTH = 128;
  NUM_LAYERS = 3;
  NUM_HEADS = 4;
  FEEDFORWARD_WIDTH = 256;
  DECODER_HIDDEN_WIDTH = 128;
  MASK_RATIO = 0.25;
  HUBER_DELTA = 1.0;
  SCALE_FLOOR = 0.000001;
  LAYER_NORM_EPSILON = 0.00001;
  SAMPLING_INTERVAL = 300000;
  DEVICE = cuda:0;
}
