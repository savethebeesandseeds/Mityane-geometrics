# Packed January development geometry. Encoder capacity matches width128.conf.
# The finest channel is 5-minute bars, not 1-minute bars. Patch length is 8.
# Each channel's own candle count is a multiple of that patch length and makes
# at least three groups. Exactly 3 is legal. 32 five-minute candles are 4
# groups. 24 hourly candles are 3 groups. 24 daily candles are 3 groups.
# The shared row is the longest of those counts, so it is 32 slots and 4 groups.
# The hour row and the day row sit on the right. Eight slots on their left are
# empty, and that empty stretch is one whole group. A group is either empty or
# filled with that channel's candles. The loss includes every channel. The
# masker needs three filled groups: it hides one and leaves two visible. Four
# filled groups, on the 5-minute channel, is the case that shows a larger count
# still masks. The comparison is at least 3. The hour channel and the day
# channel are exactly 3.
# The application declaration of 24 five-minute, 24 hourly, and 7 daily bars is
# a different count. Seven daily bars are not a legal count under patch length
# 8. This file does not copy them. This file does not replace width128.conf and
# it does not promote a research reference. Windows already built for an earlier
# count list stay where they are.
ENCODER {
  MODEL_TAG = CPB-family;
  CHANNEL_COUNT = 3;
  CHANNEL_IDS = 6, 9, 15;
  CHANNEL_BAR_COUNTS = 32, 24, 24;
  INPUT_WIDTH = 9;
  HISTORY_LENGTH = 32;
  PATCH_LENGTH = 8;
  LEVEL_EMBEDDING_SIZE = 32;
  EMBEDDING_SIZE = 36;
  ENCODER_WIDTH = 128;
  NUM_LAYERS = 3;
  NUM_HEADS = 4;
  FEEDFORWARD_WIDTH = 256;
  DECODER_HIDDEN_WIDTH = 128;
  MASK_RATIO = 0.25;
  HUBER_DELTA = 1.0;
  SCALE_FLOOR = 0.000001;
  LAYER_NORM_EPSILON = 0.00001;
  SAMPLING_INTERVAL = 300000;
  DEVICE = cuda:0;
}
